<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recherche · 3logy</title>
  <meta name="description" content="Rechercher un jeu, un film, un article ou une astuce dev.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230c0d12'/%3E%3Crect x='7' y='15' width='5' height='10' rx='2.5' fill='%233ddc97'/%3E%3Crect x='13.5' y='7' width='5' height='18' rx='2.5' fill='%23a78bfa'/%3E%3Crect x='20' y='11' width='5' height='14' rx='2.5' fill='%23f5b544'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="recherche">
  <header class="nav container">
    <a href="index.html" class="logo"><span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i></span>3logy</a>
    <nav class="nav-links" aria-label="Pages">
      <a href="hub.html" data-nav="hub">Le hub</a>
      <a href="defi.html" data-nav="defi">Le défi</a>
      <a href="recherche.html" data-nav="recherche">Recherche</a>
    </nav>
  </header>

  <main class="container search-page">
    <div class="page-head">
      <div>
        <h1>Rechercher</h1>
        <p>Un jeu, un film, un article ou une astuce dev.</p>
      </div>
    </div>

    <form class="search-form" id="search-form" role="search">
      <label class="sr-only" for="search-input">Rechercher</label>
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input class="search-input" id="search-input" type="search" name="q" autocomplete="off" autofocus
             placeholder="Zelda, Nolan, flexbox, git rebase…">
    </form>

    <div class="chips" id="filters" role="group" aria-label="Filtrer les résultats"></div>

    <p class="search-status" id="search-status" aria-live="polite"></p>

    <div id="suggestions" class="suggestions">
      <p class="panel-title">Idées de recherche</p>
      <div class="chips" id="suggestion-chips"></div>
    </div>

    <div id="results" class="search-results"></div>
  </main>

  <footer class="footer container">
    <span>3logy · Jour 04 du défi 30 jours, 30 projets · <a href="https://github.com/PierreWZK/3logy" target="_blank" rel="noopener">Code sur GitHub ↗</a></span>
    <span>
      Données jeux : <a href="https://rawg.io/" target="_blank" rel="noopener">RAWG</a> ·
      Films : <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>
      (ce site utilise l'API TMDB sans être approuvé ni certifié par TMDB)
    </span>
  </footer>

  <script type="module" src="js/search.js"></script>
</body>
</html>
