<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le défi du jour · 3logy</title>
  <meta name="description" content="Un défi par jour, qui alterne entre dev, jeux vidéo et cinéma. Trois essais, un indice à chaque erreur.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230c0d12'/%3E%3Crect x='7' y='15' width='5' height='10' rx='2.5' fill='%233ddc97'/%3E%3Crect x='13.5' y='7' width='5' height='18' rx='2.5' fill='%23a78bfa'/%3E%3Crect x='20' y='11' width='5' height='14' rx='2.5' fill='%23f5b544'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="defi">
  <header class="nav container">
    <a href="index.html" class="logo"><span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i></span>3logy</a>
    <nav class="nav-links" aria-label="Pages">
      <a href="hub.html" data-nav="hub">Le hub</a>
      <a href="defi.html" data-nav="defi">Le défi</a>
      <a href="recherche.html" data-nav="recherche">Recherche</a>
    </nav>
  </header>

  <main>
    <div class="challenge" id="challenge">
      <div class="challenge-head">
        <span class="badge" id="challenge-badge"></span>
        <h1 id="challenge-title"></h1>
        <p id="challenge-sub"></p>
        <div class="attempts" id="attempts" aria-label="Essais"></div>
      </div>

      <p class="demo-notice" data-demo-notice hidden>
        <strong>Mode démo :</strong> les API jeux et films ne sont pas configurées, le défi utilise des exemples.
      </p>

      <div class="challenge-card">
        <div id="challenge-visual"><div class="skeleton" style="aspect-ratio: 16 / 9; border-radius: 0"></div></div>
        <div class="challenge-body">
          <ul class="clues" id="clues" aria-live="polite"></ul>
          <div class="options" id="options" role="group" aria-label="Réponses"></div>
          <div id="result" aria-live="polite"></div>
        </div>
      </div>

      <dl class="stats" id="stats"></dl>
      <p class="next-challenge" id="next-challenge"></p>
    </div>
  </main>

  <footer class="footer container">
    <span>3logy · Jour 04 du défi 30 jours, 30 projets</span>
    <span>
      Données jeux : <a href="https://rawg.io/" target="_blank" rel="noopener">RAWG</a> ·
      Films : <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>
      (ce site utilise l'API TMDB sans être approuvé ni certifié par TMDB)
    </span>
  </footer>

  <script type="module" src="js/defi.js"></script>
</body>
</html>
